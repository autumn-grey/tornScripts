# Posts the faction's tournament scoreboard to Discord at 00:00 UTC each day.
name: JLT scoreboard

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  post:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: discord/jlt-scoreboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
      - run: node index.mjs
        env:
          TORN_API_KEY: ${{ secrets.TORN_API_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
